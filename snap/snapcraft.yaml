name: influxdb2-gael
version: "v2.9.0"
base: core24
summary: InfluxDB2
description: |
  InfluxDB2

grade: stable
confinement: strict

platforms:
  amd64:

license: "Apache-2.0"

apps:
  influxdb2-daemon:
    command: influxdb2_daemon.sh
    install-mode: disable
    daemon: forking
    plugs:
    - network
    - network-bind

  influxdb2:
    command: influxdb2.sh
    plugs:
    - network
    - network-bind

parts:
  launchers:
    plugin: dump
    source: snap/local/launchers

  influxdb:
    plugin: dump
    source: https://dl.influxdata.com/influxdb/releases/influxdb2_2.9.0-1_amd64.deb
    source-type: deb
